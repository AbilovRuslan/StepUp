plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.register('apiSmoke') {
    group = 'verification'
    description = 'Run API smoke tests'
    dependsOn ':api-tests:smokeTest'
}

tasks.register('uiSmoke') {
    group = 'verification'
    description = 'Run UI smoke tests'
    dependsOn ':ui-tests:smokeTest'
}

tasks.register('smoke') {
    group = 'verification'
    description = 'Run all smoke tests (API + UI)'
    dependsOn 'apiSmoke', 'uiSmoke'
}