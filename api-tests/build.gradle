plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.assertj:assertj-core:3.27.3'
    implementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'

    // Allure
    implementation 'io.qameta.allure:allure-junit5:2.29.1'
    implementation 'io.qameta.allure:allure-rest-assured:2.29.1'
}

test {
    useJUnitPlatform()

    ignoreFailures = true

    systemProperty 'allure.results.directory',
            "${project.buildDir}/allure-results"

    doLast {
        exec {
            commandLine 'allure', 'generate',
                    "${project.buildDir}/allure-results",
                    '-o', "${project.buildDir}/allure-report",
                    '--clean'
        }

        exec {
            commandLine 'allure', 'open',
                    "${project.buildDir}/allure-report"
        }
    }
}