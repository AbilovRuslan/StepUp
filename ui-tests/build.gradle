plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')

    testImplementation 'org.seleniumhq.selenium:selenium-java:4.20.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.codeborne:selenide:7.18.1'
    testImplementation 'io.rest-assured:rest-assured:5.5.1'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'

    // Allure
    testImplementation 'io.qameta.allure:allure-junit5:2.29.1'
    testImplementation 'io.qameta.allure:allure-selenide:2.29.1'
    testImplementation 'io.qameta.allure:allure-rest-assured:2.29.1'
}

allure {
    version = '2.30.0'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.register('smokeTest', Test) {
    useJUnitPlatform {
        includeTags 'smoke'
    }
    systemProperty 'file.encoding', 'UTF-8'
}